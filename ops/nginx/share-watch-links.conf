# Location snippets for the EXISTING TLS server for share.wanoafrica.com.
# Not a standalone nginx configuration. Preserve that server's certificates
# and ACME renewal location. Confirm host ownership and nginx -t before reload.
# These retain the video identity in old links instead of sending every post home.
location = /pages/feed {
    if ($arg_videoId ~ "^[a-fA-F0-9]{24}$") {
        return 308 https://wanoafrica.com/pages/feed/$arg_videoId;
    }
    return 404;
}

location ~ "^/pages/feed/([a-fA-F0-9]{24})/?$" {
    return 308 https://wanoafrica.com/pages/feed/$1;
}
